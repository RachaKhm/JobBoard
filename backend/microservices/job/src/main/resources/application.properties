spring.application.name=job
server.port=8082

#DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
# The schema is created by database/job_db.sql, so Hibernate does not touch it.
# Use "update" instead if you want Hibernate to create/alter the tables itself.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===== Actuator =====
# Exposer les endpoints health, info et metrics (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le détail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre à Eureka le statut de /health (le service passe DOWN si un composant tombe)
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true

# Informations publiées dans /actuator/info
info.app.name=job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
info.app.team=4Actuariat - Groupe 7
